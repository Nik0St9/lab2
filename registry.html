<!DOCTYPE html>
<html>
    <head>
        <h1 style="text-align: center;">Формы</h1>
    </head>

    <body>
        <form action="">
            <fieldset style="border-radius: 10px;">
                <legend>Регистрация:</legend>
                <p>
                    <label>Имя:</label> 
                    <input type="text" required>
                </p>
                <p>
                    <label>Фамилия:</label> 
                    <input type="text">
                </p>
                <p>
                    <label>E-mail:</label>
                    <input type="email">
                </p>
                <p>
                    <label>Телефон:</label>
                    <input type="tel">
                </p>
                <p>
                    <label>Пароль:</label>
                    <input type="password" required>
                </p>
                <p>
                    <label>Подтверждение пароля:</label>
                    <input type="password" required>
                </p>
                <p>
                    <label>Дата рождения:</label>
                    <input type="date">
                </p>
                <p>
                    <label>Пол:</label>
                    <b>М</b><input name="gender" type="radio">
                    <b>Ж</b><input name="gender" type="radio">
                </p>
                <p>
                    <label>Согласен:</label>
                    <br>
                    <b>Да</b><input name="agreement" type="checkbox">
                    <b>Нет</b><input name="agreement" type="checkbox">
                </p>
                <!-- Кнопки тут -->
                <p>
                    <input type="submit" value="Отправить">
                    <input type="reset" value="Очистить">
                </p>
                
            </fieldset>
        </form>
    </body>
</html>
