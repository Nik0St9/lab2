<!DOCTYPE html>
<html>

<head>
    <h1 style="text-align: center;">Формы</h1>
</head>

<body>
    <form action="">
        <fieldset style="border-radius: 10px; border-color: red;">
            <legend style="color: red;">Регистрация:</legend>
            <p>
                <label>Имя:</label>
                <input type="text" required>
            </p>
            <p>
                <label>Фамилия:</label>
                <input type="text">
            </p>
            <p>
                <label>E-mail:</label>
                <input type="email">
            </p>
            <p>
                <label>Телефон:</label>
                <input type="tel">
            </p>
            <p>
                <label>Пароль:</label>
                <input type="password" required>
            </p>
            <p>
                <label>Подтверждение пароля:</label>
                <input type="password" required>
            </p>
            <p>
                <label>Дата рождения:</label>
                <input type="date">
            </p>
            <p>
                <label>Пол:</label>
                <b>М</b><input name="gender" type="radio">
                <b>Ж</b><input name="gender" type="radio">
            </p>
            <p>А
                <label>Согласен:</label>
                <br>
                <b>Да</b><input name="agreement" type="checkbox">
                <b>Нет</b><input name="agreement" type="checkbox">
            </p>
            <!-- Кнопки тут -->
            <p>
                <input type="submit" value="Отправить">
                <input type="reset" value="Очистить">
            </p>

        </fieldset>
    </form>

    <form action="">
        <fieldset style="border-radius: 10px; border-color: green;">
            <legend style="color: green;">Фильтр:</legend>
            <input type="text" style="width: 100%; margin-bottom: 5px;" placeholder="Поиск...">
            <select>
                <option value="value1">Категория 1</option>
                <option value="value2">Категория 2</option>
                <option value="value3">Категория 3</option>
            </select>

            <select>
                <option value="LowToHigh">По возрастанию</option>
                <option value="HighToLow">По убыванию</option>
            </select>

            <br>
            <label>Цена:</label>
            <input type="range" min="0" max="100" step="10" value="50">

            <br>
            <label>Чекбоксы?</label>
            <b>Да</b><input name="checkboxs" type="checkbox">
            <b>Нет</b><input name="checkboxs" type="checkbox">

            <br>
            <label>Точно?</label>
            <b>Да</b><input name="Sure" type="radio">
            <b>Нет</b><input name="Sure" type="radio">

            <p>
                <input type="submit" value="Применить">
                <input type="reset" value="Сбросить">
            </p>
        </fieldset>
    </form>

    <form action="">
        <fieldset style="border-radius: 10px; border-color: blue;">
            <legend style="color: blue;">Обратная связь:</legend>
            <p>
                <label>Имя:</label>
                <input type="text" required>
            </p>
            <p>
                <label>E-mail:</label>
                <input type="email" required>
            </p>
            <p>
                <label>Тема:</label>
                <input type="text">
            </p>
            <textarea id="Text" rows="4" cols="50" placeholder="Введите свое сообщение..." required></textarea>
            <p>
                <label>Прикрепить файл:</label>
                <input type="file">
            </p>
            <input type="submit" value="Отправить">
        </fieldset>
    </form>

    <form action="">
        <fieldset style="border-radius: 10px; border-color: rgb(255, 55, 161);">
            <legend style="color: rgb(255, 55, 161);">Большая форма:</legend>

            <fieldset style="border-top-left-radius: 7px; border-top-right-radius: 7px;">
                <legend>Личные данные:</legend>
                <p>
                    <label>Имя:</label>
                    <input type="text">
                </p>
                <p>
                    <label>Фамилия:</label>
                    <input type="text">
                </p>
                <p>
                    <label>Дата рождения:</label>
                    <input type="date">
                </p>
            </fieldset>

            <fieldset>
                <legend>Контакты:</legend>
                <p>
                    <label>E-mail:</label>
                    <input type="email">
                </p>
                <p>
                    <label>E-mail (Запасной):</label>
                    <input type="email">
                </p>
                <p>
                    <label>Телефон:</label>
                    <input type="tel">
                </p>
                <p>
                    <label>Телефон (Второй):</label>
                    <input type="tel">
                </p>
            </fieldset>

            <fieldset>
                <legend>Предпочтения:</legend>
                <p><input name="musicGenre" type="checkbox"><b>Классическая</b></p>
                <p><input name="musicGenre" type="checkbox"><b>Поп</b></p>
                <p><input name="musicGenre" type="checkbox"><b>Рок</b></p>
                <p><input name="musicGenre" type="checkbox"><b>Джаз</b></p>
                <p><input name="musicGenre" type="checkbox"><b>Электроника</b></p>
            </fieldset>
            <fieldset style="border-bottom-right-radius: 7px; border-bottom-left-radius: 7px;">
                <legend>Дополнительная информация:</legend>
                <textarea id="Text" rows="4" cols="50" placeholder="Расскажите еще о себе..." required></textarea>
            </fieldset>
            <p>
                <input type="submit" value="Отправить">
                <input type="reset" value="Очистить">
            </p>

        </fieldset>
    </form>
</body>

</html>
