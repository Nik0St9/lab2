<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="contentBox">
        <h1>Заголовок content box</h1>
        <p>Ширина и высота задают размеры только содержимого элемента, паддинг и бордер добавляются к этим размерам,
            увеличивая общий размер блока</p>
    </div>

    <div class="borderBox">
        <h1>Заголовок border box</h1>
        <p>Ширина и высота обозначают размер не только содержимого, т.е. паддинг будет расширять сам блок</p>
    </div>

</body>

</html>
